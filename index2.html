<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Новогодний подарок 🎅</title>
<style>
*{box-sizing:border-box;font-family:'Georgia',serif;}
body{
  margin:0;
  background: linear-gradient(to bottom,#0b1d3a,#02040a);
  color:#fff;
  overflow-x:hidden;
  min-height:100vh;
}

/* ❄️ снег */
.snowflake{
  position:absolute;
  top:-10px;
  font-size:12px;
  color:white;
  opacity:0.8;
  animation:fall linear infinite;
}
@keyframes fall{to{transform:translateY(120vh);}}

/* центр и кнопки */
.center{text-align:center;}
input{padding:10px;margin:5px;border-radius:8px;border:none;font-size:16px;}
button{padding:10px 20px;margin:10px;border:none;border-radius:12px;background:gold;color:#000;font-size:16px;cursor:pointer;}
.hidden{display:none;}
.letter,.stats,.gift,.tree-game{max-width:700px;margin:20px auto;padding:30px;border-radius:20px;background:rgba(255,255,255,0.05);}
.stat-bar{height:25px;background:#444;border-radius:12px;margin:10px 0;position:relative;}
.stat-fill{height:100%;background:gold;width:0%;border-radius:12px;transition:width 1s;}

/* 🎄 Ёлка */
.tree-container{position:relative;width:250px;height:400px;margin:20px auto;}
.tree-layer{
  width:0;
  height:0;
  border-left:125px solid transparent;
  border-right:125px solid transparent;
  border-bottom:100px solid #0a3;
  position:absolute;
  left:0;top:0;
  border-radius:10px;
}
.tree-layer:nth-child(2){border-bottom-color:#0c5;top:80px;}
.tree-layer:nth-child(3){border-bottom-color:#0e7;top:150px;}
.tree-trunk{width:50px;height:70px;background:#654321;position:absolute;bottom:0;left:50%;transform:translateX(-50%);border-radius:5px;}

/* игрушки и огоньки */
.ornament{width:20px;height:20px;border-radius:50%;position:absolute;cursor:pointer;transition:transform 0.3s;border:2px solid #fff;}
.ornament:hover{transform:scale(1.5);}
.light{width:10px;height:10px;border-radius:50%;position:absolute;box-shadow:0 0 8px yellow;animation:flicker 1.5s infinite alternate;}
@keyframes flicker{0%{opacity:0.4;}50%{opacity:1;}100%{opacity:0.5;}}

/* звезда */
.star{width:30px;height:30px;background:yellow;clip-path: polygon(50% 0%,61% 38%,100% 38%,69% 59%,79% 100%,50% 75%,21% 100%,31% 59%,0% 38%,39% 38%);position:absolute;cursor:pointer;top:-10px;left:50%;transform:translateX(-50%);}

/* конфетти */
.confetti{
  position:fixed;
  width:10px;
  height:10px;
  background:gold;
  top:0;
  left:0;
  opacity:0.9;
  pointer-events:none;
  animation:fallConfetti linear forwards;
}
@keyframes fallConfetti{
  0%{transform:translateY(0) rotate(0deg);}
  100%{transform:translateY(100vh) rotate(720deg);}
}

/* мини-игра: тайминг */
#gameArea{position:relative;width:300px;height:400px;margin:0 auto;border:2px solid #fff;border-radius:15px;background:linear-gradient(to bottom,#0a1d3a,#02040a);overflow:hidden;}
</style>
</head>
<body>

<audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

<!-- 1️⃣ Логин -->
<div id="login" class="center">
  <h1>🎅 Вход к подарку</h1>
  <input id="username" placeholder="Имя"><br>
  <input id="password" type="password" placeholder="Пароль"><br>
  <button onclick="login()">Войти</button>
  <p id="error"></p>
</div>

<!-- 2️⃣ Письмо -->
<div id="letterDiv" class="letter hidden">
  <h2>Письмо от Деда Мороза</h2>
  <div id="letterText"></div>
  <button onclick="showStats()">Дальше → Статистика</button>
</div>

<!-- 3️⃣ Статистика -->
<div id="statsDiv" class="stats hidden">
  <h2>Статистика папы за год 🎄</h2>
  <div>Помощь семье</div>
  <div class="stat-bar"><div class="stat-fill" id="stat1"></div></div>
  <div>Терпение</div>
  <div class="stat-bar"><div class="stat-fill" id="stat2"></div></div>
  <div>Юмор</div>
  <div class="stat-bar"><div class="stat-fill" id="stat3"></div></div>
  <button onclick="showGift()">Дальше → Подарок</button>
</div>

<!-- 4️⃣ Подарок -->
<div id="giftDiv" class="gift hidden">
  <h2>🎁 Подарок!</h2>
  <div id="giftText" class="hidden">✨ Сюрприз! Ты лучший папа! ✨</div>
  <button onclick="revealGift()">Открыть подарок</button>
  <button onclick="showTreeGame()">Дальше → Укрась ёлку</button>
</div>

<!-- 5️⃣ Мини-игра Ёлка -->
<div id="treeDiv" class="tree-game hidden">
  <h2>Укрась ёлку 🎄</h2>
  <div class="tree-container" id="treeContainer">
    <div class="tree-layer"></div>
    <div class="tree-layer"></div>
    <div class="tree-layer"></div>
    <div class="tree-trunk"></div>
    <div class="star" id="star"></div>
  </div>
  <p>Перетаскивай игрушки и звезду мышкой!</p>
  <button onclick="showGiftGame()">Дальше → Поймай подарки</button>
</div>

<!-- 6️⃣ Мини-игра: Тайминг с подарками -->
<div id="giftGameDiv" class="tree-game hidden">
  <h2>Поймай падающие подарки 🎁</h2>
  <p>Кликни на подарки, чтобы поймать их! Счёт: <span id="score">0</span></p>
  <div id="gameArea"></div>
  <button onclick="endGiftGame()">Закончить игру</button>
</div>

<script>
// ❄️ снег
for(let i=0;i<60;i++){
  const s=document.createElement("div");
  s.className="snowflake";
  s.innerText="❄";
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=5+Math.random()*6+"s";
  s.style.fontSize=10+Math.random()*14+"px";
  document.body.appendChild(s);
}

let userName="";
function login(){
  userName=document.getElementById("username").value||"друг";
  const pass=document.getElementById("password").value;
  if(pass==="12"){
    document.getElementById("login").style.display="none";
    document.getElementById("music").play();
    showLetter();
  }else{
    document.getElementById("error").innerText="❌ Неверный пароль";
  }
}

// Письмо
function showLetter(){
  document.getElementById("letterDiv").classList.remove("hidden");
  const text=`Дорогой ${userName} 🎅\n\nСпасибо за заботу, терпение и тепло в этом году.\nПусть следующий год будет ещё лучше!\nС любовью, Дед Мороз ❄️`;
  let i=0;
  function typeWriter(){ 
    if(i<text.length){
      document.getElementById("letterText").innerHTML+=text[i]==="\n"? "<br>":text[i];
      i++; setTimeout(typeWriter,40);
    }
  }
  typeWriter();
}

// Статистика
function showStats(){
  document.getElementById("letterDiv").classList.add("hidden");
  document.getElementById("statsDiv").classList.remove("hidden");
  setTimeout(()=>document.getElementById("stat1").style.width="100%",100);
  setTimeout(()=>document.getElementById("stat2").style.width="90%",200);
  setTimeout(()=>document.getElementById("stat3").style.width="95%",400);
}

// Подарок
function showGift(){
  document.getElementById("statsDiv").classList.add("hidden");
  document.getElementById("giftDiv").classList.remove("hidden");
}
function revealGift(){
  document.getElementById("giftText").classList.remove("hidden");
  launchConfetti();
}

// Ёлка
function showTreeGame(){
  document.getElementById("giftDiv").classList.add("hidden");
  document.getElementById("treeDiv").classList.remove("hidden");
  createOrnaments();
  createLights();
  makeDraggable();
}

// Игрушки
function createOrnaments(){
  const tree=document.getElementById("treeContainer");
  for(let i=0;i<8;i++){
    const o=document.createElement("div");
    o.className="ornament";
    o.style.background=['red','yellow','blue','purple','orange'][i%5];
    o.style.bottom=Math.random()*250+"px";
    o.style.left=Math.random()*180+"px";
    tree.appendChild(o);
  }
}

// Огни
function createLights(){
  const tree=document.getElementById("treeContainer");
  for(let i=0;i<12;i++){
    const l=document.createElement("div");
    l.className="light";
    l.style.bottom=Math.random()*250+"px";
    l.style.left=Math.random()*220+"px";
    tree.appendChild(l);
  }
}

// Перетаскивание
function makeDraggable(){
  const draggables=document.querySelectorAll(".ornament, .star");
  draggables.forEach(el=>{
    el.onmousedown=function(e){
      let shiftX=e.clientX-el.getBoundingClientRect().left;
      let shiftY=e.clientY-el.getBoundingClientRect().top;
      el.style.position="absolute";
      el.style.zIndex=1000;
      moveAt(e.pageX,e.pageY);
      function moveAt(pageX,pageY){
        el.style.left=pageX-shiftX+"px";
        el.style.top=pageY-shiftY+"px";
      }
      function onMouseMove(event){ moveAt(event.pageX,event.pageY); }
      document.addEventListener('mousemove',onMouseMove);
      el.onmouseup=function(){
        document.removeEventListener('mousemove',onMouseMove);
        el.onmouseup=null;
      }
    }
    el.ondragstart=function(){return false;}
  });
}

// Конфетти
function launchConfetti(){
  for(let i=0;i<100;i++){
    const c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=['red','yellow','blue','green','purple'][i%5];
    c.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),6000);
  }
}

// Мини-игра: Тайминг с подарками
let score=0;
let gameInterval;

function showGiftGame(){
  document.getElementById("treeDiv").classList.add("hidden");
  document.getElementById("giftGameDiv").classList.remove("hidden");
  score=0;
  document.getElementById("score").innerText=score;
  startGiftGame();
}

function startGiftGame(){
  const area=document.getElementById("gameArea");
  gameInterval=setInterval(()=>{
    const gift=document.createElement("div");
    gift.style.width="30px";
    gift.style.height="30px";
    gift.style.background="red";
    gift.style.position="absolute";
    gift.style.left=Math.random()*270+"px";
    gift.style.top="0px";
    gift.style.borderRadius="5px";
    gift.style.cursor="pointer";
    gift.onclick=function(){
      score++;
      document.getElementById("score").innerText=score;
      gift.remove();
    };
    area.appendChild(gift);
    
    let topPos=0;
    const fall=setInterval(()=>{
      topPos+=3;
      gift.style.top=topPos+"px";
      if(topPos>370){
        gift.remove();
        clearInterval(fall);
      }
    },20);
  },800);
}

function endGiftGame(){
  clearInterval(gameInterval);
  alert("Игра окончена! Ты поймал " + score + " подарков! 🎉");
}
</script>
</body>
</html>
