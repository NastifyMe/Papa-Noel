<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Regalo de Papá Noel</title>
</head>
<body>
    <div class="container_languages">
        <a href="./index.html" class="ruso">Ruso</a>
        <a href="./spanish.html" class="spanish">Español</a>
    </div>

    <!-- 1️⃣ Login -->
    <div id="loginDiv" class="center">
        <h1 class="login_title">Acceso secreto 🎅</h1>
        <input class="login_name" type="text" placeholder="Nombre">
        <input class="login_password" type="text" placeholder="Contraseña">
        <button class="btn_login">Entrar</button>
        <p class="error"></p>
    </div>

    <!-- 2️⃣ Carta -->
    <div id="container_latter" class="hidden">
        <h1 class="title_letter">Carta de Papá Noel 🎄</h1>
        <div class="container_text_letter">
            <p id="letter"></p>
        </div>
        <button class="btn_next">Siguiente</button>
    </div>

    <!-- 3️⃣ Estadísticas -->
    <div id="container_statistics" class="hidden">
        <h1 class="title_statistics">Estadísticas del año 🎄</h1>
        <div class="container_stats">
            <div class="title_stat">Ayuda a la familia ❤️</div>
            <div class="stat-bar"><div class="stat-fill" id="stat1"></div></div>
            <div class="title_stat">Arreglos realizados 🔧</div>
            <div class="stat-bar"><div class="stat-fill" id="stat2"></div></div>
            <div class="title_stat">Paciencia 😌</div>
            <div class="stat-bar"><div class="stat-fill" id="stat3"></div></div>
        </div>
        <div class="container-stat-btns">
            <button class="btn_back_stat">Atrás</button>
            <button class="btn_next_stat">Siguiente</button>
        </div>
    </div>

    <!-- 4️⃣ Regalo -->
    <div id="container_gift" class="hidden">
        <h1 class="title_gift">Regalo 🎁</h1>
        <img src="./images/gifts.png" alt="" id="gift" class="gift">

        <div id="giftContent" class="hidden-gift">
            <img src="./images/items/money.jpg" alt="" class="item-gift">
            <img src="./images/items/home.jpg" alt="" class="item-gift">
            <img src="./images/items/car.jpg" alt="" class="item-gift">
            <img src="./images/items/bisnes.jpg" alt="" class="item-gift">
        </div>
        <button class="btn_back_gift">Atrás</button>
        <div class="confetti"></div>
    </div>

    <script src="./spanish.js"></script>
</body>
</html>
